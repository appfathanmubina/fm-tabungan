<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8e33f5">
  <meta name="description" content="Aplikasi Tabungan dan Keuangan Kelas Fathan Mubina">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tabungan FM">
  <title>Tabungan FM</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { font-family: system-ui, sans-serif; background: #f7f0ff; color: #541793; }
    #app { display: block; width: 100%; height: 100%; border: 0; background: white; }
    #offline { display: none; min-height: 100%; padding: 2rem; place-content: center; text-align: center; }
    #offline h1 { margin-bottom: .5rem; }
    #offline p { color: #57466a; }
  </style>
</head>
<body>
  <iframe id="app" title="Tabungan FM" allow="clipboard-read; clipboard-write; geolocation"></iframe>
  <main id="offline">
    <div>
      <h1>Tabungan FM</h1>
      <p>Aplikasi memerlukan koneksi internet untuk terhubung ke Google Apps Script. Periksa koneksi, lalu muat ulang halaman.</p>
      <button onclick="location.reload()">Muat ulang</button>
    </div>
  </main>
  <script src="./app-config.js"></script>
  <script>
    const frame = document.getElementById('app');
    const offline = document.getElementById('offline');
    let deferredInstallPrompt = null;

    // GitHub Pages adalah konteks PWA induk; Apps Script dapat memakai iframe bersarang.
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredInstallPrompt = event;
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
    });

    function isAppsScriptOrigin(origin) {
      try {
        const hostname = new URL(origin).hostname;
        return origin === 'https://script.google.com' ||
          hostname === 'script.googleusercontent.com' ||
          hostname.endsWith('-script.googleusercontent.com');
      } catch (_) {
        return false;
      }
    }

    window.addEventListener('message', async event => {
      if (!isAppsScriptOrigin(event.origin) ||
          !event.data ||
          event.data.type !== 'TABUNGAN_PWA_INSTALL_REQUEST') return;

      if (!deferredInstallPrompt) {
        event.source.postMessage(
          { type: 'TABUNGAN_PWA_INSTALL_UNAVAILABLE' },
          event.origin
        );
        return;
      }

      const promptEvent = deferredInstallPrompt;
      deferredInstallPrompt = null;
      try {
        await promptEvent.prompt();
        const choice = await promptEvent.userChoice;
        event.source.postMessage(
          { type: 'TABUNGAN_PWA_INSTALL_RESULT', outcome: choice && choice.outcome },
          event.origin
        );
      } catch (error) {
        console.error('Prompt instalasi PWA gagal:', error);
        event.source.postMessage(
          { type: 'TABUNGAN_PWA_INSTALL_UNAVAILABLE' },
          event.origin
        );
      }
    });

    frame.src = TABUNGAN_APP_SCRIPT_URL;
    frame.addEventListener('error', () => { frame.style.display = 'none'; offline.style.display = 'grid'; });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(console.error));
    }
  </script>
</body>
</html>
